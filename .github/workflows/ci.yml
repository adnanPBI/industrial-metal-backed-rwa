name: ReserveChain CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Generate derived site data
        run: python scripts/generate_site_data.py
      - name: Static audit
        run: python tests/static_audit.py
      - name: End-to-end smoke test
        run: bash tests/smoke.sh
      - name: Package validation
        run: bash scripts/validate-package.sh
