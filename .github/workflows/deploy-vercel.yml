name: Deploy ReserveChain demo to Vercel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel.yml"
      - "vercel.json"
      - "package.json"
      - "api/**"
      - "public-demo/**"
      - "scripts/**"
      - "wordpress/**"
      - "fixtures/**"
      - ".github/workflows/visual-browser-qa.yml"
      - "tests/editorial-browser-qa.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservechain-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'adnans-projects-1993fd6c' }}
      VERCEL_PROJECT_NAME: industrial-metal-backed-rwa
      VERCEL_TEAM_ID: team_GI0H1MJPmSQhzRXjQ1DMbK27

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret VERCEL_TOKEN is missing or empty"
            exit 1
          fi
          echo "VERCEL_TOKEN is configured (value hidden)."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build public app
        run: |
          set -euo pipefail
          npm run build
          node --test tests/vercel_api.test.mjs tests/theme-toggle.test.mjs tests/remediation_review.test.mjs tests/reconciliation.test.mjs tests/editorial-v2.test.mjs
          python tests/static_audit.py
          bash tests/smoke.sh
          test -s dist/index.html
          test -s dist/assets/js/site-data.js

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Bind the exact existing Vercel team and production project
        shell: bash
        run: |
          set -euo pipefail
          vercel whoami --scope="$VERCEL_SCOPE"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID" \
          | node -e '
            const fs=require("node:fs");
            const p=JSON.parse(fs.readFileSync(0,"utf8"));
            const team=process.env.VERCEL_TEAM_ID;
            const name=process.env.VERCEL_PROJECT_NAME;
            if(p.name!==name || p.accountId!==team || !/^prj_[A-Za-z0-9]+$/.test(p.id)){
              console.error("Refusing deployment: Vercel project/team identity mismatch");
              process.exit(1);
            }
            fs.mkdirSync(".vercel",{recursive:true});
            fs.writeFileSync(".vercel/project.json",JSON.stringify({orgId:team,projectId:p.id})+"\n");
            fs.appendFileSync(process.env.GITHUB_ENV,"VERCEL_ORG_ID="+team+"\nVERCEL_PROJECT_ID="+p.id+"\n");
            console.log("Verified existing production target: "+p.name+" / "+team+" / "+p.id);
          '
          vercel project inspect --non-interactive --scope="$VERCEL_SCOPE"

      - name: Deploy to production
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_output=$(vercel deploy --prod --yes --scope="$VERCEL_SCOPE" --project="$VERCEL_PROJECT_ID")
          printf '%s\n' "$deployment_output"
          url=$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app[^[:space:]]*' | tail -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::Vercel CLI did not return a deployment URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          host=$(printf '%s' "$url" | sed -E 's#^https?://([^/]+).*#\1#')
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_TEAM_ID" \
          | node -e '
            const fs=require("node:fs");
            const d=JSON.parse(fs.readFileSync(0,"utf8"));
            if(d.projectId!==process.env.VERCEL_PROJECT_ID || d.target!=="production" || d.readyState!=="READY"){
              console.error("Vercel deployment verification failed: project, target or readiness mismatch");
              process.exit(1);
            }
            console.log("Verified production deployment: "+d.id+" / "+d.projectId+" / "+d.readyState);
          '
          {
            echo "### ReserveChain Vercel deployment"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Scope: \`$VERCEL_SCOPE\`"
            echo "- URL: $url"
            echo "- Mode: PRE-LAUNCH; no token purchase, issuance, or redemption"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Allow public access to production (retain preview protection)
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-protection.json" --write-out "%{http_code}" \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"ssoProtection":{"deploymentType":"preview"}}')
          if [[ "$code" != 2* ]]; then
            echo "::error::Could not set preview-only deployment protection; Vercel API returned HTTP $code"
            exit 1
          fi
          echo "Production deployment protection: public alias; preview deployments still protected."
          echo "Production URL: https://industrial-metal-backed-rwa.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Live smoke test
        shell: bash
        env:
          DEPLOY_URL: https://industrial-metal-backed-rwa.vercel.app
        run: |
          set -euo pipefail
          base="${DEPLOY_URL%/}"
          html=$(curl --fail-with-body -sSL --retry 3 --retry-delay 5 "$base/")
          printf '%s' "$html" | grep -q 'ReserveChain'
          echo "Homepage HTTP and ReserveChain HTML: PASS"
          copper=$(curl --fail-with-body -sSL "$base/copper-powder")
          printf '%s' "$copper" | grep -q 'ReserveChain'
          echo "SPA copper route: PASS"
          health=$(curl --fail-with-body -sSL "$base/api/health")
          printf '%s' "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("mode")=="PRE-LAUNCH", d'
          echo "Serverless health endpoint: PASS"
          assets=$(curl --fail-with-body -sSL "$base/api/assets")
          printf '%s' "$assets" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["items"])==2'
          echo "Asset API: PASS"
          curl --fail-with-body -sSL -o /dev/null "$base/assets/img/editorial/hero-industrial-still-life-light.webp"
          echo "Polished V2 hero artwork: PASS"
          echo "All live smoke tests passed" >> "$GITHUB_STEP_SUMMARY"
